# Throwaway config for the zephyrftp proftpd test container — not
# production-hardened, just enough for a real proftpd to serve one test
# user over plain FTP. Deliberately no mod_facts/MLSD configured — this
# is meant to be a SECOND independent no-MLSD LIST-format example
# alongside vsftpd, not a duplicate of the MLSD path pyftpdlib already
# covers in tools/local-test-servers/ftp_server.py.
ServerName "zephyrftp-test-proftpd"
ServerType standalone
DefaultAddress 0.0.0.0
Port 21
Umask 022
MaxInstances 30

# AuthUserFile (mod_auth_file), NOT system PAM/shadow — a deliberate
# choice made directly from vsftpd's own container wiring in this same
# directory: getting a real system account authenticating via PAM in a
# minimal container took real debugging (see Containerfile.vsftpd's
# comment), and proftpd's own independent flat-file auth mechanism
# sidesteps that whole class of problem entirely. No system user is
# created for this at all — AuthUserFile's uid/gid fields are used
# directly against the ownership Containerfile.proftpd sets on /srv/ftp.
AuthOrder mod_auth_file.c
AuthUserFile /etc/proftpd/proftpd.passwd
AuthGroupFile /etc/proftpd/proftpd.group
RequireValidShell off

DefaultRoot ~
PassivePorts 2201 2210
MasqueradeAddress 127.0.0.1

# This build's mod_facts is compiled in (not a loadable module this
# package lets you omit), so MLSD/MLST work out of the box — confirmed
# directly, not assumed. Denied explicitly to keep this container in its
# planned role: a SECOND independent no-MLSD LIST-format example
# alongside vsftpd (which never implements MLSD at all), not a second
# MLSD-capable server duplicating what pyftpdlib already covers.
<Limit MLSD MLST>
    DenyAll
</Limit>

# FTPS (explicit AUTH TLS), available but not mandatory (TLSRequired
# off) — a client that never issues AUTH TLS (the existing plain-FTP
# verification phase) stays on an unencrypted connection exactly as
# before. Cert/key baked into the image by Containerfile.proftpd's own
# build-time RUN step. mod_tls.c is compiled into this build (confirmed
# via `proftpd -l`, not assumed), so no LoadModule directive is needed.
<IfModule mod_tls.c>
    TLSEngine on
    TLSRequired off
    TLSRSACertificateFile /etc/proftpd/ftps-cert.pem
    TLSRSACertificateKeyFile /etc/proftpd/ftps-key.pem
    # Read via `podman exec zephyrftp-test-proftpd cat /var/log/proftpd-tls.log`.
    # This is what confirmed the finding below for real: a genuine
    # "client did not reuse TLS session, rejecting data connection" line.
    TLSLog /var/log/proftpd-tls.log
    # Deliberately NOT setting "TLSOptions NoSessionReuseRequired" — the
    # proftpd package's own shipped reference config
    # (/etc/proftpd/mod_tls.conf) documents that option as a relaxation
    # of a requirement that's otherwise ON by default: without it,
    # mod_tls requires the data connection's TLS session to reuse the
    # control connection's session, refusing it otherwise. That default
    # strict behavior is exactly the real, independent second
    # confirmation this container exists for — this project's own
    # TLS-session-ticket-reuse implementation (FtpBackend.cpp's
    # m_controlSessionTicket) had never been tested against a server
    # that actually enforces this before.
</IfModule>
