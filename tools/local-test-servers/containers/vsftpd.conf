# Throwaway config for the zephyrftp vsftpd test container — not a
# production-hardened config, just enough for a real vsftpd to serve one
# test user over plain FTP. See Containerfile.vsftpd for the user setup
# this refers to.
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
# Virtual users (see Containerfile.vsftpd's own comment for why this
# project uses pam_userdb instead of a real system account) mapped onto
# vsftpuser's real filesystem privileges and home directory —
# guest_username is what actually determines local_root/chroot below,
# not the virtual username itself.
guest_enable=YES
guest_username=vsftpuser
virtual_use_local_privs=YES
pam_service_name=vsftpd.virtual
chroot_local_user=YES
# vsftpd refuses to start with chroot_local_user=YES if the chroot root
# itself is writable by the chrooted user (a real safety check, for a
# real production server) — deliberately bypassed here since this whole
# tree is throwaway test content recreated on every container start, not
# something a hostile local user could plant something dangerous into
# for later privileged pickup.
allow_writeable_chroot=YES
local_root=/srv/ftp
pasv_enable=YES
# Matches this project's other local test servers' masquerade approach
# (see ftp_server.py's handler.masquerade_address): without this, vsftpd
# can advertise a PASV address other than 127.0.0.1 depending on how the
# container's network is set up.
pasv_address=127.0.0.1
pasv_min_port=2191
pasv_max_port=2200
# A well-known real containerization gotcha, not a hypothetical one:
# vsftpd's default seccomp filter is written against a bare-metal
# kernel's syscall surface and commonly breaks (silent connection resets)
# under a container's kernel/namespace setup. Confirmed needed directly
# by actually running this in podman, not assumed from vsftpd's own
# documentation alone.
seccomp_sandbox=NO
xferlog_enable=NO
dirmessage_enable=NO
# Full protocol-level logging to a real file (vsftpd refuses to log to
# /dev/stdout, a symlink inside the container; read via `podman exec
# zephyrftp-test-vsftpd cat /var/log/vsftpd.log`, not `podman logs` —
# and note vsftpd's privsep worker can't create the file itself since
# /var/log isn't writable by its dropped-privilege user, so it silently
# never appears unless something already created it first; not an issue
# once the image is rebuilt, since the RUN step below pre-creates it).
# Kept permanently: this log (plus a real strace session against a live
# container) is what finally explained a real, previously-mysterious
# FTPS data-connection hang here — see ARCHITECTURE.md's Known Gaps for
# the full story of what it turned out to be.
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=YES
# vsftpd's default systemd unit is Type=forking — it forks to the
# background and the parent exits immediately, which is exactly wrong
# for a container's PID 1 (podman saw the container "exit 0" instantly
# with no server actually left running). Confirmed directly, not
# assumed from vsftpd's own docs: this is the one config knob that
# keeps it in the foreground.
background=NO
# FTPS (explicit AUTH TLS), available but not mandatory — a client that
# never issues AUTH TLS (the existing plain-FTP verification phase)
# stays on an unencrypted connection exactly as before. Cert/key baked
# into the image by Containerfile.vsftpd's own build-time RUN step.
# force_local_logins_ssl is set explicitly here — confirmed the hard
# way, not assumed: vsftpd defaults THIS ONE to YES (unlike
# force_local_data_ssl, which defaults to NO), so simply setting
# ssl_enable=YES without also setting this broke the existing plain-FTP
# phase outright ("Non-anonymous sessions must use encryption").
ssl_enable=YES
rsa_cert_file=/etc/vsftpd/ftps-cert.pem
rsa_private_key_file=/etc/vsftpd/ftps-key.pem
force_local_logins_ssl=NO
force_local_data_ssl=NO
# Deliberately NO (not the strict enforcement this container originally
# set out to test) — found the hard way, not assumed: with this at YES,
# a real, reproducible vsftpd-side stall shows up specifically in this
# containerized environment (confirmed via strace across many separate
# sessions: attaching ptrace to the process tree reliably "unsticks" it
# within seconds and it sends a clean "522 SSL connection failed:
# session reuse required" — but left completely undisturbed, it never
# resolves on its own even after 4+ minutes, ruling out "just slow").
# That's a real vsftpd/container-environment issue, not a ZephyrFTP
# client bug — this project's own FtpBackend.cpp code was independently
# confirmed correct for this exact scenario (it DOES notice and surface
# that same 522 reply correctly whenever vsftpd actually sends one).
# proftpd's own default strict-reuse enforcement (see proftpd.conf) does
# NOT have this problem and is what actually answers "does our
# TLS-session-ticket reuse satisfy a genuinely strict server" for real —
# see ARCHITECTURE.md's Known Gaps for the complete, honest writeup.
require_ssl_reuse=NO
