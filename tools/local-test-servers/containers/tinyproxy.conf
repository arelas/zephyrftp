# Throwaway test config — BasicAuth is a real username/password the
# proxy actually enforces, exercising ProxyConnect.cpp's
# Proxy-Authorization header path for real (see Containerfile.tinyproxy's
# own comment). Allow 0.0.0.0/0 rather than a real ACL: this container
# is only ever reachable via podman's own port mapping from localhost,
# same throwaway security posture Containerfile.vsftpd/.proftpd already
# have — not internet-facing, nothing to protect here.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
Allow 0.0.0.0/0
BasicAuth proxyuser proxypass
LogFile "/dev/stdout"
LogLevel Info
PidFile "/var/run/tinyproxy/tinyproxy.pid"
