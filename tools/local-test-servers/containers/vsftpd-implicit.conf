# Throwaway config for the zephyrftp vsftpd IMPLICIT-FTPS test
# container — a near-duplicate of vsftpd.conf (see that file's own
# comments for the shared reasoning behind every setting not called out
# again here), differing only in the settings that actually distinguish
# implicit from explicit FTPS.
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
guest_enable=YES
guest_username=vsftpuser
virtual_use_local_privs=YES
pam_service_name=vsftpd.virtual
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/srv/ftp
pasv_enable=YES
pasv_address=127.0.0.1
# A distinct range from Containerfile.vsftpd's own 2191-2200 — not
# load-bearing for a single-container test run, but keeps the two
# containers collision-free if they're ever run at the same time.
pasv_min_port=2201
pasv_max_port=2210
seccomp_sandbox=NO
xferlog_enable=NO
dirmessage_enable=NO
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=YES
background=NO

# --- The actual implicit-FTPS-specific settings ---
# vsftpd's own conventional implicit-FTPS port, confirmed via the man
# page as the standard choice (not enforced by vsftpd itself, but this
# is what a real implicit-FTPS server is expected to listen on) —
# mapped to a non-privileged host port by start-vsftpd-implicit.sh, same
# "real port inside the container, safe port on the host" pattern
# start-sftp-pubkey.sh already established for SSH's port 22.
listen_port=990
ssl_enable=YES
rsa_cert_file=/etc/vsftpd/ftps-cert.pem
rsa_private_key_file=/etc/vsftpd/ftps-key.pem
# The defining setting — confirmed directly from vsftpd's own man page,
# not assumed: "an SSL handshake is the first thing expect on all
# connections." With this on, there IS no plaintext phase at all to
# selectively enforce against, unlike Containerfile.vsftpd's explicit
# config (force_local_data_ssl/force_local_logins_ssl=NO there,
# specifically to let the plain-FTP verification phase run over the
# SAME connection before AUTH TLS). Set to YES here anyway for clarity,
# even though implicit_ssl=YES already makes an unencrypted session
# structurally impossible.
implicit_ssl=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
# Same real, environment-specific stall this container's explicit-FTPS
# sibling documents (see vsftpd.conf's own comment) — left off here for
# the identical reason, not re-verified separately for implicit mode
# specifically, since the underlying cause (this container environment,
# not the SSL mode) is the same either way.
require_ssl_reuse=NO
