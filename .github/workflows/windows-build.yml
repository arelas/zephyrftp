name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Sets up cl.exe / MSVC environment variables for this job's shell.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # win64_msvc2022_64 requires Qt >= 6.8 (confirmed against
      # install-qt-action's own version/arch table after the first CI run
      # failed on this exact mismatch — Qt 6.7.x needs win64_msvc2019_64
      # instead). Pinning to 6.8 to stay paired with the MSVC 2022 toolchain
      # ilammy/msvc-dev-cmd sets up above.
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: ''

      # seanmiddleditch/gha-setup-ninja was archived (no longer maintained) —
      # replaced with lukka/get-cmake, which installs both a current CMake
      # and Ninja together and is from the same maintainer as run-vcpkg
      # below, so this workflow isn't depending on a dead action.
      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      # run-vcpkg requires the FULL 40-character commit SHA — confirmed by
      # its own error message after a tag name was rejected ("must be a
      # full SHA1 hash (40 hex digits)"). This is the full hash behind the
      # 2026.06.24 release tag.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3'

      # Caches the final installed/ output (headers, libs, DLLs) rather
      # than using vcpkg's own binary-cache mechanism — Microsoft removed
      # the x-gha backend entirely (github.com/microsoft/vcpkg-tool/pull/1662,
      # confirmed directly, not just a deprecation warning), and this
      # actions/cache approach is what that same PR thread calls out as
      # "endorsed by the GitHub Actions team." Key is pinned to the vcpkg
      # commit above plus the exact package spec — bump the trailing -v1
      # if the install command ever changes without the commit id changing,
      # to force a fresh cache.
      - name: Cache vcpkg installed packages
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-installed-windows-cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3-libssh2-x64-windows-v1

      # Skipped entirely on a cache hit — CMake's vcpkg toolchain file only
      # needs the restored headers/libs/DLLs under installed\, not vcpkg's
      # own bookkeeping, so there's nothing else to redo here.
      - name: Install libssh2 (vcpkg)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: ${{ env.VCPKG_ROOT }}\vcpkg.exe install libssh2:x64-windows
        shell: pwsh

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: pwsh

      # Diagnostic: the last run showed Configure and Build both apparently
      # succeeding (job reached Assemble instead of stopping), but Assemble
      # then couldn't find build\ at all — not just the exe, the whole
      # directory. That's inconsistent with normal step-to-step state on a
      # GitHub-hosted runner (nothing in this workflow deletes it), so
      # rather than guess at why, confirming directly here whether it
      # exists and what LASTEXITCODE actually was.
      - name: Verify Configure output
        run: |
          Write-Host "LASTEXITCODE after Configure step: $LASTEXITCODE"
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Does build\ exist? $(Test-Path build)"
          if (Test-Path build) { Get-ChildItem build\ | Select-Object Name }
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --target zephyrftp
        shell: pwsh

      - name: Verify Build output
        run: |
          Write-Host "LASTEXITCODE after Build step: $LASTEXITCODE"
          Write-Host "Does build\ exist? $(Test-Path build)"
          if (Test-Path build) { Get-ChildItem -Recurse build\ | Select-Object FullName }
        shell: pwsh

      # windeployqt bundles the Qt DLLs the exe needs; libssh2's DLL from
      # vcpkg still needs to be copied in separately since windeployqt only
      # knows about Qt's own dependencies.
      #
      # Previous version assumed the exe lands flat at build\zephyrftp.exe
      # (true for a single-config Ninja generator on Linux/most setups) —
      # that assumption was wrong here (copy failed, path didn't exist) and
      # I have no way to verify the actual CMake/Ninja/Qt6 output layout on
      # Windows from this environment. Searching for the exe instead of
      # guessing its path, and printing the whole build\ tree first so the
      # log is self-diagnosing if this still doesn't find it.
      - name: Assemble deployable folder
        run: |
          Write-Host "Full build\ directory tree:"
          Get-ChildItem -Recurse build\ | Select-Object FullName

          $exe = Get-ChildItem -Recurse -Filter "zephyrftp.exe" -Path build\ | Select-Object -First 1
          if (-not $exe) {
            Write-Error "zephyrftp.exe not found anywhere under build\ — see tree above."
            exit 1
          }
          Write-Host "Found exe at: $($exe.FullName)"

          mkdir dist
          Copy-Item $exe.FullName dist\
          windeployqt --release --no-translations dist\zephyrftp.exe
          # Copy every vcpkg-built DLL rather than cherry-picking libssh2.dll
          # by name — that missed its own runtime dependencies (OpenSSL's
          # libcrypto-3-x64.dll, zlib's z.dll), confirmed by two separate
          # "code execution cannot proceed, DLL not found" errors on a real
          # Windows run. windeployqt only knows about Qt's dependencies, not
          # libssh2's transitive ones, so this can't be delegated to it.
          Copy-Item "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin\*.dll" dist\
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: zephyrftp-windows-x64
          path: dist/
          if-no-files-found: error

  # Only runs on version tags (v1.0.0 etc.) — attaches the same build as a
  # zipped asset on a GitHub Release, matching the Phat32 pipeline pattern.
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zephyrftp-windows-x64
          path: dist

      - name: Zip release asset
        run: Compress-Archive -Path dist\* -DestinationPath zephyrftp-windows-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: zephyrftp-windows-x64.zip
