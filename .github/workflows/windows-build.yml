name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Sets up cl.exe / MSVC environment variables for this job's shell.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # win64_msvc2022_64 requires Qt >= 6.8 (confirmed against
      # install-qt-action's own version/arch table after the first CI run
      # failed on this exact mismatch — Qt 6.7.x needs win64_msvc2019_64
      # instead). Pinning to 6.8 to stay paired with the MSVC 2022 toolchain
      # ilammy/msvc-dev-cmd sets up above.
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: ''

      # seanmiddleditch/gha-setup-ninja was archived (no longer maintained) —
      # replaced with lukka/get-cmake, which installs both a current CMake
      # and Ninja together and is from the same maintainer as run-vcpkg
      # below, so this workflow isn't depending on a dead action.
      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      # run-vcpkg requires the FULL 40-character commit SHA — confirmed by
      # its own error message after a tag name was rejected ("must be a
      # full SHA1 hash (40 hex digits)"). This is the full hash behind the
      # 2026.06.24 release tag.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3'

      - name: Install libssh2 (vcpkg)
        # VCPKG_BINARY_SOURCES=clear disables vcpkg's build cache entirely.
        # Without it, vcpkg defaults to trying GitHub Actions' binary cache,
        # which needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL bridged in via
        # an extra step (they're not exposed to plain `run:` steps by
        # default) — and vcpkg's GHA backend has reportedly been in flux
        # (seen reports of it being removed in favor of a NuGet-based
        # provider). Skipping caching entirely means every run rebuilds
        # libssh2/openssl/zlib from source (slower, a few extra minutes),
        # but it's correct and doesn't depend on a backend that might not
        # be there. Worth revisiting — properly wiring up caching would
        # speed up every subsequent run — once this pipeline is stable.
        run: |
          $env:VCPKG_BINARY_SOURCES = "clear"
          ${{ env.VCPKG_ROOT }}\vcpkg.exe install libssh2:x64-windows
        shell: pwsh

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --target zephyrftp
        shell: pwsh

      # windeployqt bundles the Qt DLLs the exe needs; libssh2's DLL from
      # vcpkg still needs to be copied in separately since windeployqt only
      # knows about Qt's own dependencies.
      #
      # Previous version assumed the exe lands flat at build\zephyrftp.exe
      # (true for a single-config Ninja generator on Linux/most setups) —
      # that assumption was wrong here (copy failed, path didn't exist) and
      # I have no way to verify the actual CMake/Ninja/Qt6 output layout on
      # Windows from this environment. Searching for the exe instead of
      # guessing its path, and printing the whole build\ tree first so the
      # log is self-diagnosing if this still doesn't find it.
      - name: Assemble deployable folder
        run: |
          Write-Host "Full build\ directory tree:"
          Get-ChildItem -Recurse build\ | Select-Object FullName

          $exe = Get-ChildItem -Recurse -Filter "zephyrftp.exe" -Path build\ | Select-Object -First 1
          if (-not $exe) {
            Write-Error "zephyrftp.exe not found anywhere under build\ — see tree above."
            exit 1
          }
          Write-Host "Found exe at: $($exe.FullName)"

          mkdir dist
          Copy-Item $exe.FullName dist\
          windeployqt --release --no-translations dist\zephyrftp.exe
          copy "${{ env.VCPKG_ROOT }}\installed\x64-windows\bin\libssh2.dll" dist\
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: zephyrftp-windows-x64
          path: dist/
          if-no-files-found: error

  # Only runs on version tags (v1.0.0 etc.) — attaches the same build as a
  # zipped asset on a GitHub Release, matching the Phat32 pipeline pattern.
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zephyrftp-windows-x64
          path: dist

      - name: Zip release asset
        run: Compress-Archive -Path dist\* -DestinationPath zephyrftp-windows-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: zephyrftp-windows-x64.zip
